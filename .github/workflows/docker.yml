name: Docker images and releases

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - src/**

  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-platforms:
    name: Build ${{ matrix.label }} container
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            label: Linux amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            label: Linux arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standalone binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=pr-${{ github.event.number }}
          outputs: type=local,dest=dist/${{ matrix.arch }}
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.arch }}

      - name: Verify standalone binary artifact
        run: test -s "dist/${{ matrix.arch }}/image_service"

      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=pr-${{ github.event.number }}
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.arch }}

  publish-platform-artifacts:
    name: Publish Linux ${{ matrix.arch }} artifacts
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve and verify release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo and tag versions match
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Cargo.toml version $cargo_version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist/${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Build and publish architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          build-args: BUILD_VERSION=${{ steps.release.outputs.tag }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }}-linux-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Name and checksum binary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          install -D "dist/$ARCH/image_service" "dist/image_service-$RELEASE_TAG-linux-$ARCH"
          cd dist
          sha256sum "image_service-$RELEASE_TAG-linux-$ARCH" > "image_service-$RELEASE_TAG-linux-$ARCH.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.arch }}
          path: |
            dist/image_service-${{ steps.release.outputs.tag }}-linux-${{ matrix.arch }}
            dist/image_service-${{ steps.release.outputs.tag }}-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish multi-architecture manifest and GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: publish-platform-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture and latest tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$RELEASE_TAG" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-amd64" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-amd64" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-arm64"

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release from version tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      - name: Add ARM64 assets to the version-bump release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            dist/image_service-${{ steps.release.outputs.tag }}-linux-arm64
            dist/image_service-${{ steps.release.outputs.tag }}-linux-arm64.sha256
