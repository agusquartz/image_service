name: Docker images and releases

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - src/**

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-platforms:
    name: Build ${{ matrix.label }} container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            label: Linux amd64
          - platform: linux/arm64
            arch: arm64
            label: Linux arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standalone binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=pr-${{ github.event.number }}
          outputs: type=local,dest=dist/${{ matrix.arch }}
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.arch }}

      - name: Verify standalone binary artifact
        run: test -s "dist/${{ matrix.arch }}/image_service"

      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=pr-${{ github.event.number }}
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.arch }}

  publish-platform-artifacts:
    name: Publish Linux ${{ matrix.arch }} artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Cargo and tag versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "Cargo.toml version $cargo_version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist/${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Build and publish architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          build-args: BUILD_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-linux-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Name and checksum binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          install -D "dist/$ARCH/image_service" "dist/image_service-$RELEASE_TAG-linux-$ARCH"
          cd dist
          sha256sum "image_service-$RELEASE_TAG-linux-$ARCH" > "image_service-$RELEASE_TAG-linux-$ARCH.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.arch }}
          path: |
            dist/image_service-${{ github.ref_name }}-linux-${{ matrix.arch }}
            dist/image_service-${{ github.ref_name }}-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish multi-architecture manifest and GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-platform-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture and latest tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$RELEASE_TAG" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-amd64" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-amd64" \
            "$IMAGE_NAME:$RELEASE_TAG-linux-arm64"

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
