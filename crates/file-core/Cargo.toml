[package]
name = "file-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = ["images"]
images = ["dep:image", "dep:processor-image"]
worker-protocol = ["dep:worker-protocol"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"], optional = true }
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opendal = { version = "0.57", features = ["services-fs", "services-s3"] }
sha2 = "0.11"
httpdate = "1.0"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
processor-contract = { path = "../processor-contract" }
processor-image = { path = "../processor-image", optional = true }
worker-protocol = { path = "../worker-protocol", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
