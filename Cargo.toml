[package]
name = "image_service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

license = "Apache-2.0"

description = "A fast, configurable image processing and storage service built with Rust and Axum."

repository = "https://github.com/agusquartz/image_service"
readme = "README.md"


[dependencies]
axum = {
    version = "0.8",
    features = ["multipart"],
}

tokio = {
    version = "1",
    features = ["full"],
}

image = {
    version = "0.25",
    default-features = false,
    features = [
        "jpeg",
        "png",
        "webp",
        "gif",
        "bmp",
        "tiff",
    ],
}

webp = "0.3"

atomic-write-file = "0.3"

dirs = "5.0"
dotenvy = "0.15.7"

serde = {
    version = "1",
    features = ["derive"],
}
