[package]
name = "image_service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

license = "Apache-2.0"

description = "A fast, configurable image processing and storage service built with Rust and Axum."

repository = "https://github.com/agusquartz/image_service"
readme = "README.md"


[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

webp = "0.3"

dirs = "5.0"
dotenvy = "0.15.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
opendal = { version = "0.57", features = ["services-fs", "services-s3"] }
sha2 = "0.11"
httpdate = "1.0"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
