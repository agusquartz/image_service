[package]
name = "image_service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

license = "Apache-2.0"

description = "A fast, configurable image processing and storage service built with Rust and Axum."

repository = "https://github.com/agusquartz/image_service"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/file-core",
    "crates/processor-contract",
    "crates/processor-image",
    "crates/worker-protocol",
    "crates/job-scheduler",
]
resolver = "2"

[features]
default = ["images"]
images = ["file-core/images"]
worker-protocol = ["file-core/worker-protocol"]
all = ["images", "worker-protocol"]

[dependencies]
file-core = { path = "crates/file-core", default-features = false }
dotenvy = "0.15.7"
