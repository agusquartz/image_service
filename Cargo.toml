[package]
name = "image_service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

license = "Apache-2.0"

description = "A fast, configurable image processing and storage service built with Rust and Axum."

repository = "https://github.com/agusquartz/image_service"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/image-core",
    "crates/processor-contract",
    "crates/image-processor-image",
    "crates/image-worker-protocol",
]
resolver = "2"

[features]
default = ["images"]
images = ["image-core/images"]
ipc = ["image-core/ipc"]
all = ["images", "ipc"]

[dependencies]
image-core = { path = "crates/image-core", default-features = false }
dotenvy = "0.15.7"
